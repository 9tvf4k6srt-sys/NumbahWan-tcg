# Example: cinematic landing page spec
# Doctrine: references/LANDING-CINEMATIC.md — the page is a short film.
# Beats follow the arc: chaos → precision → mastery (assembly → explosion → reassembly).
#
#   node bin/page-gen.cjs specs/example-landing-cinematic.yaml --dry-run
#   node bin/page-gen.cjs specs/example-landing-cinematic.yaml
#   node tools/landing-lint.cjs public/example-cinematic.html

type: landing-page
slug: example-cinematic
title: The Forge Reassembled

theme:
  primary: "#ff6b00"
  grade: "rgba(20,16,40,0.28)"   # one tint per page, from the brand world

hero:
  kicker: NumbahWan Forge
  title: A thousand parts. One machine.
  subtitle: Watch the forge tear itself apart and rebuild — then take the controls yourself.
  scroll_cue: Scroll to explore the transformation
  # Hero video: ≤4MB, WebM + MP4, poster is mandatory (LCP + fallback ladder)
  video:
    webm: /static/video/forge-hero.webm
    mp4: /static/video/forge-hero.mp4
    poster: /static/images/forge-hero-poster.webp
    aria: The forge assembling itself from scattered parts

cta:
  text: Enter the Forge
  href: /forge.html

# 3–5 beats. Each beat: one idea, one visual, copy that mirrors the visual.
beats:
  - kicker: Chaos
    title: Every part scattered
    body: Ten thousand components drift in the dark — gears, plates, coils. Nothing fits yet. This is where every machine begins.
    media:
      src: /static/images/forge-beat-chaos.webp
      alt: Scattered machine components floating in darkness

  - kicker: Precision
    title: The pull toward order
    body: Piece by piece, the parts find their places. Tolerances of a tenth of a millimeter. No force, no waste — just fit.
    media:
      type: video
      webm: /static/video/forge-beat-assembly.webm
      mp4: /static/video/forge-beat-assembly.mp4
      poster: /static/images/forge-beat-assembly-poster.webp

  - kicker: Mastery
    title: Now it answers to you
    body: The finished machine is yours to pull apart and rebuild. Drag to explode it. Scroll to reassemble it. Every part remembers where it belongs.
    layout: center
    media:
      type: 3d
      module: /static/nw-forge-3d.js
      alt: Interactive exploded view of the forge machine
      cue: Drag to explode · scroll to reassemble
